<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskManager - Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1>TaskManager</h1>
      <h2>Crear Cuenta</h2>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required minlength="6">
        </div>
        
        <button type="submit" class="btn btn-primary btn-full">Registrarse</button>
      </form>
      
      <p class="auth-link">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
      </p>
      
      <p id="registerError" class="error-message"></p>
      <p id="registerSuccess" class="success-message"></p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const errorEl = document.getElementById('registerError');
      const successEl = document.getElementById('registerSuccess');
      
      errorEl.textContent = '';
      successEl.textContent = '';
      
      try {
        const response = await fetch('http://localhost:3000/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          successEl.textContent = data.message + ' Redirigiendo...';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          errorEl.textContent = data.error || 'Error al registrar';
        }
      } catch (error) {
        errorEl.textContent = 'Error de conexión';
      }
    });

    if (localStorage.getItem('token')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
